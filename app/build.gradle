plugins {
    id 'com.android.application'
}

android {
    namespace 'com.toxicgaming.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.toxicgaming.app'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '2.2'
    }

    // Fixed debug key so each new APK installs over the previous one (CI runners otherwise
    // generate a fresh random debug key per build). Not a release key; use a private key for Play.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Serves bundled assets over https://appassets.androidplatform.net so ES modules
    // and Firebase work (file:// URLs block module scripts and have a null origin).
    implementation 'androidx.webkit:webkit:1.12.1'
}
