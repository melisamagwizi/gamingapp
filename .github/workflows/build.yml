name: Build & test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: toxic-gaming-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      # Stable public download link that always serves the newest APK:
      # https://github.com/<owner>/<repo>/releases/latest/download/ToxicGaming.apk
      - name: Publish APK as the latest release
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'claude/code-review-app-build-x4fcon')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ToxicGaming.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest ToxicGaming.apk --target "$GITHUB_SHA" --latest \
            --title "Toxic Gaming app (latest build)" \
            --notes "Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Download ToxicGaming.apk on the Android phone and install it (allow 'Install unknown apps' when asked). New versions install over the old one."

  tests:
    name: Firestore rules + UI tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
