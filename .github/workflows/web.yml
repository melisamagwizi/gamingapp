name: Deploy web app

# Publishes the same UI the Android app bundles (app/src/main/assets) to GitHub Pages.
# Both clients read firebase-config.js, so they share one Firebase backend.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main, claude/code-review-app-build-x4fcon]
    paths: ["app/src/main/assets/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/src/main/assets
      - id: deployment
        uses: actions/deploy-pages@v4
